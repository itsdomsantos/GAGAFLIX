name: Instagram autopilot

# Three posts a day (UTC; Lisbon = UTC+0 in winter, UTC+1 in summer):
#   11:37  news   — a Lady Gaga story (Lady Gaga Now first, then Billboard, Variety…)
#   17:07  extra  — "N years ago today" / "Today: …" (timeline + LGN calendar), else
#                   the videos just added to GAGAFLIX, else a promo (vault · era · site reel)
#   20:37  news   — a different story (never the same one twice)
# A news slot with no fresh story simply skips.
#
# Publishes only when INSTAGRAM_ACCESS_TOKEN + INSTAGRAM_USER_ID exist
# (plus SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY, for the data, the memory
# and the image hosting). Otherwise it is a TEST RUN: it renders the post and
# attaches it to the run — open the run → "Artifacts" to download it.
on:
  schedule:
    - cron: "37 11 * * *" # news
    - cron: "7 17 * * *"  # extra
    - cron: "37 20 * * *" # news
  workflow_dispatch:
    inputs:
      slot:
        description: "What to post"
        type: choice
        options: [news, extra, today, new, vault, era, reel]
        default: extra
      dry_run:
        description: "Test run: render only, don't publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: instagram-autopilot # never two posts at once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Make sure ffmpeg is there (for reels)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Pick slot
        id: slot
        run: |
          case "${{ github.event.schedule }}" in
            "7 17 * * *") echo "slot=extra" >> "$GITHUB_OUTPUT" ;;
            "") echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT" ;;
            *) echo "slot=news" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Post
        run: node --no-warnings automation/social/run.mjs --slot "${{ steps.slot.outputs.slot }}" ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://gagaflix.com' }}
          NEWS_ARTICLE_IMAGES: ${{ vars.NEWS_ARTICLE_IMAGES }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-${{ steps.slot.outputs.slot }}-${{ github.run_number }}
          path: out/social/
          if-no-files-found: ignore
          retention-days: 14
