name: Instagram autopilot

# One post a day at ~17:00 UTC (evening in Europe, lunchtime in the US).
# It picks the format itself: "N years ago today" when the timeline has a
# moment on this date, the "New this week" roundup on Sundays, otherwise a
# rotation (from the vault · era spotlight · promo reel).
#
# Publishes only when INSTAGRAM_ACCESS_TOKEN + INSTAGRAM_USER_ID exist
# (plus SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY, for the data, the memory
# and the image hosting). Otherwise it is a TEST RUN: it renders the post and
# attaches it to the run — open the run → "Artifacts" to download it.
on:
  schedule:
    - cron: "7 17 * * *" # 17:07 UTC daily
  workflow_dispatch:
    inputs:
      slot:
        description: "What to post (auto = let the autopilot choose)"
        type: choice
        options: [auto, anniversary, weekly, vault, era, reel]
        default: auto
      dry_run:
        description: "Test run: render only, don't publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: instagram-autopilot # never two posts at once
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Make sure ffmpeg is there (for reels)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Post
        run: >
          node --no-warnings automation/social/run.mjs
          ${{ inputs.slot && inputs.slot != 'auto' && format('--slot {0}', inputs.slot) || '' }}
          ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://gagaflix.com' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-${{ github.run_number }}
          path: out/social/
          if-no-files-found: ignore
          retention-days: 14
